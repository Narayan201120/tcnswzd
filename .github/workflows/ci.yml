name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
      - name: Lint
        run: ruff check backend tests
      - name: Test with coverage
        run: |
          coverage run -m pytest
          coverage report --include=backend/metrics.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
        working-directory: frontend
      - name: Lint
        run: npm run lint
        working-directory: frontend
      - name: Test
        run: npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start and wait for health
        run: docker compose up -d --wait
      - name: Smoke test /health on both origins
        run: |
          curl -fsS http://localhost:8000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:3000/health | grep -q '"status":"ok"'
      - name: Smoke test accuracy summary values
        run: |
          body=$(curl -fsS "http://localhost:3000/api/accuracy/summary?start=2026-01-02&end=2026-02-01&cutoff=09:00")
          echo "$body" | grep -q '"mae_mw":2038.9126344086021'
          echo "$body" | grep -q '"bias_mw":1747.8870967741937'
      - name: Tear down
        if: always()
        run: docker compose down -v
