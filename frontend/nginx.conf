server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Forward the original URI, so the /api prefix reaches FastAPI unchanged.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Hash routing keeps every view on /, but a fallback keeps deep paths sane.
    location / {
        try_files $uri /index.html;
    }
}
